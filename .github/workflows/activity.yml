name: Update recent activity

on:
  schedule:
    - cron: "0 6 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/update-activity.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "Luprintech"
          git config user.email "132688456+Luprintech@users.noreply.github.com"
          git add README.md README_EN.md
          git diff --cached --quiet || (git commit -m "chore: update recent activity" && git push)
